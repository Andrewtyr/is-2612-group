name: is-2612-group

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: group
      POSTGRES_DB: group_system
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U group -d group_system']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./uploads:/app/uploads
    environment:
      API_PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter @group/api db:deploy && pnpm --filter @group/api start"
  cyber-safe:
    build:
      context: ./apps/cyber-safe
    restart: unless-stopped
    env_file: .env.cyber-safe
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      BASE_PATH: /cyber-safe
      PUBLIC_ORIGIN: https://is2612.ru
      DATA_DIR: /app/data
    volumes:
      - cyber_safe_data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      cyber-safe:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
volumes:
  postgres_data:
  cyber_safe_data:
